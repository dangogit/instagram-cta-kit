name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - name: Smoke test generated configuration
        run: |
          home="$(mktemp -d)"
          node bin/instagram-cta.mjs init --dir "$home" --locale en --mode polling
          node bin/instagram-cta.mjs doctor --dir "$home"
          node bin/instagram-cta.mjs routes validate --dir "$home"
      - run: npm run pack:check
