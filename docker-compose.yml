services:
  instagram-cta:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:18787:18787"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./routes.json:/app/routes.json:ro
      - instagram-cta-state:/app/state

volumes:
  instagram-cta-state:
